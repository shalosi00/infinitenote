[package]
name = "infinitenote"
version = "1.6.0"
description = "Local-first OneNote-style notebook with an infinite canvas"
authors = ["InfiniteNote contributors"]
license = "MIT"
repository = "https://github.com/shalosi00/infinitenote"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "infinitenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
