name: Desktop

# Builds the Tauri desktop shell. NOT a required PR check: this only runs on
# main (and v* tags) because a full Rust/Tauri compile takes ~10 minutes and
# needs the webkit2gtk system libraries.
#
# The runner is PINNED to ubuntu-22.04 on purpose (issue #164): linuxdeploy
# copies webkit2gtk/glib and friends from the build host into the AppImage,
# so building on ubuntu-latest makes the bundle require the newest image's
# glibc (observed: 2.43) and the AppImage then failed to launch on Ubuntu
# 24.04 / Debian 13 / Mint 22 with no visible error. The glibc-floor guard
# below fails the build if that ever regresses. Do not bump the runner
# without re-checking the guard and the supported-distro matrix in
# docs/desktop.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Highest GLIBC symbol version bundled ELF files may require (ubuntu-22.04
  # ships glibc 2.35). Enforced after the build; see issue #164.
  GLIBC_FLOOR: "2.35"

jobs:
  linux:
    name: Linux build (deb / rpm / AppImage) + glibc floor guard
    runs-on: ubuntu-22.04
    steps:
      # Third-party actions are SHA-pinned (mutable tag pins are a supply-chain
      # risk; this job runs with contents: write); dependabot's github-actions
      # ecosystem keeps the pins updated.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned 2026-11-13)

      - name: Rust cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      # Tauri v2 prerequisites for Debian/Ubuntu
      # (https://tauri.app/start/prerequisites/).
      - name: Install webkit2gtk build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle (static export)
        run: bun run build:desktop

      - name: Build desktop bundles
        run: bun run tauri build

      # Issue #164: the released v1.11.0 AppImage bundled libraries taken
      # from the (much newer) ubuntu-latest image and required GLIBC_2.42/
      # 2.43, so it silently failed to launch on every current LTS distro
      # when double-clicked. Guard: no bundled ELF file may require a GLIBC
      # symbol version above the floor.
      - name: Enforce the AppImage glibc floor
        run: |
          set -euo pipefail
          APPIMAGE="$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"
          "$APPIMAGE" --appimage-extract >/dev/null
          maxv="$(find squashfs-root -type f -exec sh -c \
            'for f do objdump -T "$f" 2>/dev/null; done' sh {} + \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | cut -d_ -f2- | sort -Vu | tail -1 || true)"
          rm -rf squashfs-root
          echo "Highest GLIBC symbol version required by the bundle: ${maxv:-none}"
          if [ -n "${maxv:-}" ] && [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$maxv" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::Bundled libraries require GLIBC_${maxv}, above the ${GLIBC_FLOOR} floor — the AppImage would fail to launch on target distros (issue #164). Pin an older build runner."
            exit 1
          fi

      - name: Upload build artifacts (retention copy)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infinitenote-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

      - name: Attach artifacts to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
