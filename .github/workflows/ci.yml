name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default: the workflow token is read-only for every job
# below. (The repo-level default_workflow_permissions is also set to "read"
# via the API; this block keeps the workflow safe even if that setting ever
# changes.) No job here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are SHA-pinned (mutable tag pins are a supply-chain
      # risk); dependabot's github-actions ecosystem keeps the pins updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard against leaked secrets
        run: |
          if grep -rInE '(ghp_|github_pat_|sk-)[A-Za-z0-9_-]{20,}' \
              --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Potential secret detected in the tree"
            exit 1
          fi
          echo "No secrets detected"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun's install cache
        # The majors' CI-caching practice (majors-research wave 4; Logseq's
        # build.yml combines setup-node's `cache:` input with explicit
        # actions/cache steps). setup-bun has no cache input (verified
        # against its action.yml), so caching is an explicit step: bun's
        # package cache keyed on the lockfile, with a prefix restore-key so
        # a lockfile change still starts from the previous cache and
        # downloads only the delta.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test src/lib/__tests__

  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Cache bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build (standalone)
        # retry twice for belt-and-braces (a 2026-11-11 wave of 9 consecutive
        # e2e/build-smoke panics was fixed by moving the build to webpack —
        # Turbopack's PostCSS worker IPC deadline elapsed deterministically
        # on slower shared runners; the retries stay in case the runner pool
        # misbehaves again)
        run: bun run build || bun run build || bun run build
      - name: Boot smoke test
        run: |
          (bun run start &) 
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Smoke OK: production server responded on :3000"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production server did not respond within 60s"
          exit 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Cache bun's install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Playwright's Chromium
        # The browser version is pinned by bun.lock, so the lockfile hash is
        # the right key. No restore-keys by design: a stale browser from an
        # older playwright version must never satisfy the cache — a miss
        # just downloads fresh, exactly the pre-change behavior.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite (builds the app, boots it, drives a real browser)
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
