name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against leaked secrets
        run: |
          if grep -rInE '(ghp_|github_pat_|sk-)[A-Za-z0-9_-]{20,}' \
              --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Potential secret detected in the tree"
            exit 1
          fi
          echo "No secrets detected"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test src/lib/__tests__

  build-smoke:
    name: build-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Production build (standalone)
        # retry twice for belt-and-braces (a 2026-11-11 wave of 9 consecutive
        # e2e/build-smoke panics was fixed by moving the build to webpack —
        # Turbopack's PostCSS worker IPC deadline elapsed deterministically
        # on slower shared runners; the retries stay in case the runner pool
        # misbehaves again)
        run: bun run build || bun run build || bun run build
      - name: Boot smoke test
        run: |
          (bun run start &) 
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Smoke OK: production server responded on :3000"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production server did not respond within 60s"
          exit 1

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run E2E suite (builds the app, boots it, drives a real browser)
        run: bunx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
