name: CodeQL

# Static security analysis (code scanning). Before 2026-11-13 no analysis had
# ever run on this repo — this workflow closes that gap. It analyzes the
# JavaScript/TypeScript sources (the entire app is a client-side Next.js PWA)
# and uploads SARIF results to the Security tab.
#
# Weekly schedule + every push/PR to the protected branches, mirroring the CI
# triggers. PR runs only analyze changed files (CodeQL incrementally), so the
# cost is small.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      # needed to upload SARIF results to the Security tab
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
          # the vendored HWR/OCR/tesseract assets under public/ are third-party
          # upstream builds, not first-party code — excluded to keep results
          # focused on InfiniteNote's own sources
          paths-ignore: |
            public/hwr
            public/ocr
            public/pdf.worker.min.mjs

      - uses: github/codeql-action/autobuild@9418214df1f2c4b8128c770156c409013b07d6b9 # v3

      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:javascript-typescript"
