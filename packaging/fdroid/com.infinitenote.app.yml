Name: InfiniteNote
AutoName: InfiniteNote
Summary: Local-first infinite-canvas notebook with OneNote import
Description: |-
  Open-source OneNote-style notebook for Linux and Android: notebooks,
  sections and pages on an infinite canvas you can draw and type on.

  Features:
  * Infinite canvas (draw/write on anything, Excalidraw-based)
  * Notebook → Section → Page hierarchy with colors and reordering
  * Import from OneNote (.mht single-file pages, exported HTML, .docx),
    Markdown, PDF printouts, images and .excalidraw scenes
  * Export to PNG, SVG, paginated PDF and full notebook backups
  * Full-text search, page tags with a filter view, soft-delete trash
  * File-based sync (folder or ZIP) with page-granular merge
  * Per-page paper styles (plain / ruled / grid) and dark mode
  * Works fully offline; all data stays on the device (IndexedDB)
  * English UI with full CJK content support (titles, tags, search, IME)

